name: Vercel Project Config

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TEAM_ID: team_Y3XMFNoRG7WQfKOwI8vhDSpy
    steps:
      - name: Set pixel env var
        run: |
          set -euo pipefail
          echo "== existing env =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID&decrypt=false" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"key":e.get("key"),"target":e.get("target"),"value":e.get("value")} for e in d.get("envs",[])], indent=1))'

          echo "== create/update NEXT_PUBLIC_META_PIXEL_ID =="
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID&upsert=true" \
            -d '{"key":"NEXT_PUBLIC_META_PIXEL_ID","value":"1097346703065459","type":"plain","target":["production","preview","development"]}')
          echo "HTTP $code"
          cat /tmp/create.json | head -c 600
          echo

          echo "== env after =="
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID&decrypt=false" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"key":e.get("key"),"target":e.get("target"),"value":e.get("value")} for e in d.get("envs",[])], indent=1))'
