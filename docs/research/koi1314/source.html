<script id="koi-entry-controller">(()=>{
 'use strict';
 const root=document.documentElement,boot=document.getElementById('koi-entry-boot');
 if(!boot||window.KoiEntry?.active)return;
 const retry=boot.querySelector('button'),message=boot.querySelector('[role="status"]');
 if(!retry||!message)return;
 const locale=(()=>{try{const base=new Intl.Locale(String(new URLSearchParams(location.search).get('lang')||window.KOI_MARKET_BOOT?.lang||'en').trim().replaceAll('_','-')).language;return ['ar','ur','tr','id','zh','en','hi','es','it','pt'].includes(base)?base:'en';}catch{return 'en';}})();
 const copy={ar:['الاتصال بطيء قليلًا. حاول مجددًا.','إعادة المحاولة'],ur:['رابطے میں وقت لگ رہا ہے۔ دوبارہ کوشش کریں۔','دوبارہ کوشش کریں'],tr:['Bağlantı biraz yavaş. Tekrar dene.','Tekrar dene'],id:['Koneksi agak lambat. Coba lagi.','Coba lagi'],zh:['连接暂时较慢，请重试。','重新加载'],en:['The connection is taking a little longer. Please try again.','Try again'],hi:['कनेक्शन में समय लग रहा है। फिर कोशिश करें।','फिर कोशिश करें'],es:['La conexión está tardando. Inténtalo de nuevo.','Reintentar'],it:['La connessione è lenta. Riprova.','Riprova'],pt:['A conexão está demorando. Tente novamente.','Tentar novamente']}[locale]||['The connection is taking a little longer. Please try again.','Try again'];
 let timer;
 function active(){return root.classList.contains('koi-booting');}
 function cleanup(){clearTimeout(timer);window.removeEventListener('error',scriptError,true);}
 function fail(value){if(!active())return false;cleanup();const translated=window.KOI_I18N?.[locale]?.entry||copy;message.textContent=value||translated[0]||copy[0];message.hidden=false;retry.textContent=translated[1]||copy[1];retry.hidden=false;return true;}
 function ready(){cleanup();root.classList.remove('koi-booting');boot.setAttribute('aria-hidden','true');}
 function criticalScript(value){
  if(!value)return false;
  try{const url=new URL(value,location.href);return url.origin===location.origin&&/^(?:entry|market-config|locale-config|markets|i18n-(?:international|journey|rewards|extras|traffic)|payout|profiles|registration-reward|rewards|browser-continuation|registration|guest-entry|phone-validation|phone-registration|personal-profile|journey|profile-deck|app|meta-test-bridge|flow-test)\.js$/.test(url.pathname.split('/').pop());}catch{return false;}
 }
 function scriptError(event){
  if(!active())return;
  const target=event.target;
  if(target?.tagName==='SCRIPT'&&criticalScript(target.src)||criticalScript(event.filename))fail();
 }
 retry.addEventListener('click',()=>location.reload());
 window.KoiEntry={ready,fail,active};window.addEventListener('error',scriptError,true);timer=setTimeout(()=>fail(),22000);
})();</script>
